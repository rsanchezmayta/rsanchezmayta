<svg xmlns="http://www.w3.org/2000/svg" width="820" height="170" viewBox="0 0 820 170" role="img" aria-labelledby="title desc">
  <title id="title">De los datos a una aplicación</title>
  <desc id="desc">Tres pasos conectados: explorar datos, evaluar modelos y publicar resultados en un tablero o una API.</desc>
  <style>
    .signal { animation: travel 3.6s ease-in-out 1; }
    @keyframes travel {
      0%, 12% { transform: translateX(0); opacity: 0; }
      20% { opacity: 1; }
      85% { opacity: 1; }
      98%, 100% { transform: translateX(706px); opacity: 0; }
    }
    .stage { animation: highlight 3.6s ease-out 1; }
    .model { animation-delay: .9s; }
    .delivery { animation-delay: 1.8s; }
    @keyframes highlight {
      0%, 55%, 100% { stroke-width: 1; }
      20% { stroke-width: 3; stroke: #f5f5ef; }
    }
    @media (prefers-reduced-motion: reduce) { .signal, .stage { animation: none; } }
  </style>
  <defs>
    <linearGradient id="palette">
      <stop stop-color="#a4e5c8"/>
      <stop offset=".5" stop-color="#abcfff"/>
      <stop offset="1" stop-color="#d4bdf6"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="818" height="168" rx="20" fill="#101312" stroke="#303330" stroke-width="2"/>
  <path d="M52 13H768" stroke="url(#palette)" stroke-opacity=".5" stroke-width="2" stroke-linecap="round"/>
  <circle class="signal" cx="52" cy="13" r="4" fill="#f5f5ef" opacity="0"/>
  <g fill="#141514" stroke="#476456">
    <rect class="stage" x="22" y="24" width="240" height="122" rx="12"/>
    <rect class="stage model" x="290" y="24" stroke="#536480" width="240" height="122" rx="12"/>
    <rect class="stage delivery" x="558" y="24" stroke="#66577c" width="240" height="122" rx="12"/>
  </g>
  <g fill="none" stroke="#a4e5c8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M271 85h10m-4-4 4 4-4 4M539 85h10m-4-4 4 4-4 4"/>
    <path d="M44 67V45m0 22h28m-21-5 7-9 5 4 9-12"/>
    <path d="m317 63 8-15 12 13m-12-13 13-2"/>
    <circle cx="317" cy="63" r="3"/><circle cx="325" cy="48" r="3"/><circle cx="337" cy="61" r="3"/><circle cx="338" cy="46" r="3"/>
    <rect x="580" y="45" width="27" height="22" rx="3"/><path d="M580 51h27m-21 6 4 3-4 3m8 0h6"/>
  </g>
  <g font-family="monospace" font-size="20" font-weight="bold" fill="#a4e5c8">
    <text x="43" y="101">Explorar datos</text>
    <text x="311" y="101" fill="#abcfff">Evaluar modelos</text>
    <text x="579" y="101" font-size="17" fill="#d4bdf6">Publicar resultados</text>
  </g>
  <g font-family="sans-serif" font-size="16" fill="#f5f5ef">
    <text x="43" y="125">Python · SQL · pandas</text>
    <text x="311" y="125">scikit-learn · XGBoost</text>
    <text x="579" y="125">Tableros · APIs REST</text>
  </g>
</svg>
