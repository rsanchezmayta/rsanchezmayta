<svg xmlns="http://www.w3.org/2000/svg" width="840" height="280" viewBox="0 0 840 280" role="img" aria-labelledby="title desc">
<title id="title">Aprendiendo a entender los datos</title>
<desc id="desc">Ciencia de Datos e Inteligencia Artificial. Una red de nodos animada ilustra el aprendizaje y la conexión entre datos.</desc>
<defs>
<linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101713"/><stop offset="1" stop-color="#111827"/></linearGradient>
<linearGradient id="accent"><stop stop-color="#a4e5c8"/><stop offset=".5" stop-color="#abcfff"/><stop offset="1" stop-color="#d4bdf6"/></linearGradient>
<radialGradient id="halo"><stop stop-color="#a4e5c8" stop-opacity=".15"/><stop offset="1" stop-color="#a4e5c8" stop-opacity="0"/></radialGradient>
</defs>
<style>
.flow { stroke-dasharray: 8 22; animation: flow 5s linear infinite; }
.orbit { transform-origin: 665px 140px; animation: orbit 45s linear infinite; }
.core { animation: breathe 4s ease-in-out infinite; }
@keyframes flow { to { stroke-dashoffset: -120; } }
@keyframes orbit { to { transform: rotate(360deg); } }
@keyframes breathe { 0%,100% { opacity: .45; } 50% { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .flow,.orbit,.core { animation: none; } }
</style>
<rect x="1" y="1" width="838" height="278" rx="22" fill="url(#bg)" stroke="#354b43" stroke-width="2"/>
<rect x="34" y="30" width="36" height="4" rx="2" fill="#a4e5c8"/>
<text x="34" y="67" fill="#a4e5c8" font-family="monospace" font-size="16" letter-spacing="1">CIENCIA DE DATOS + IA</text>
<g font-family="sans-serif" font-weight="700" font-size="43" fill="#f5f5ef">
<text x="31" y="128">Aprendiendo a</text><text x="31" y="180">entender los datos.</text>
</g>
<text x="34" y="235" fill="#abcfff" font-family="monospace" font-size="17">Explorar · modelar · construir</text>
<circle cx="665" cy="140" r="132" fill="url(#halo)"/>
<g class="orbit" fill="none" stroke="#abcfff" stroke-opacity=".3">
<circle cx="665" cy="140" r="112" stroke-dasharray="4 9"/>
<circle cx="777" cy="140" r="4" fill="#abcfff"/>
</g>
<g stroke="#546979" stroke-width="1.5" fill="none">
<path d="M555 85L625 65L699 90L765 65M555 85L625 140L699 90L765 140M555 140L625 65M555 140L625 140L699 190L765 215M555 195L625 140L699 90M555 195L625 215L699 190L765 140M625 65L699 190M625 215L699 90L765 215"/>
</g>
<g class="flow" fill="none" stroke="url(#accent)" stroke-width="2.5">
<path d="M555 85L625 140L699 90L765 140"/><path d="M555 195L625 215L699 190L765 215"/>
</g>
<g fill="#a4e5c8"><circle cx="555" cy="85" r="7"/><circle cx="555" cy="140" r="7"/><circle cx="555" cy="195" r="7"/></g>
<g fill="#abcfff"><circle cx="625" cy="65" r="8"/><circle cx="625" cy="140" r="10"/><circle cx="625" cy="215" r="8"/></g>
<g fill="#d4bdf6"><circle cx="699" cy="90" r="10"/><circle cx="699" cy="190" r="9"/></g>
