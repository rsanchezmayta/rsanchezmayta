<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 248" width="800" height="248" role="img" aria-labelledby="title description">
  <title id="title">369 mil denuncias del SIDPOL–MININTER</title>
  <desc id="description">Análisis geográfico y temporal de denuncias policiales en Perú. La ilustración de puntos es decorativa.</desc>
  <style>
    .pulse { animation: reveal 2.6s ease-out both; transform-box: fill-box; transform-origin: center; }
    @keyframes reveal { 0% { opacity: .35; transform: scale(.65); } 55% { opacity: 1; transform: scale(1.15); } 100% { opacity: .85; transform: scale(1); } }
    @media (prefers-reduced-motion: reduce) { .pulse { animation: none; } }
  </style>
  <defs>
    <linearGradient id="bg" x2="1" y2="1">
      <stop stop-color="#101312"/><stop offset="1" stop-color="#172329"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#abcfff" stroke-opacity=".13"/>
    </pattern>
  </defs>
  <rect x="1" y="1" width="798" height="246" rx="22" fill="url(#bg)" stroke="#476456" stroke-width="2"/>
  <rect x="446" y="24" width="328" height="200" rx="12" fill="url(#grid)"/>
  <path d="m468 190 43-38 56 12 51-54 47 17 56-59 32 11" fill="none" stroke="#abcfff" stroke-opacity=".65" stroke-width="2"/>
  <g class="pulse" fill="#a4e5c8">
    <circle cx="511" cy="152" r="5"/><circle cx="567" cy="164" r="7"/><circle cx="618" cy="110" r="10"/><circle cx="665" cy="127" r="6"/><circle cx="721" cy="68" r="8"/>
  </g>
  <g fill="none" stroke="#d4bdf6" stroke-opacity=".65">
    <circle cx="618" cy="110" r="22"/><circle cx="721" cy="68" r="18"/>
  </g>
  <text x="36" y="58" fill="#a4e5c8" font-family="monospace" font-size="20">SIDPOL / MININTER</text>
  <text x="32" y="144" fill="#f5f5ef" font-family="sans-serif" font-weight="700" font-size="78">369 mil</text>
  <text x="37" y="185" fill="#abcfff" font-family="sans-serif" font-size="24">denuncias analizadas</text>
  <text x="37" y="215" fill="#b9bdb6" font-family="sans-serif" font-size="18">Perú · análisis geográfico y temporal</text>
  <text x="752" y="214" text-anchor="end" fill="#b9bdb6" font-family="monospace" font-size="13">Ilustración</text>
</svg>
